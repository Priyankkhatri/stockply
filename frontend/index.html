<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta -->
    <title>Stockply | Advanced Inventory Management & Supply Chain SaaS</title>
    <meta name="description" content="Stockply is the definitive inventory management platform for retail shops and suppliers. Experience real-time tracking, intelligent analytics, and seamless logistics in a high-fidelity digital atelier." />
    <meta name="keywords" content="Stockply, inventory management software, supply chain platform, retail inventory, supplier management, inventory tracking India, SaaS inventory, Kirana store software, pharmacy inventory management" />
    <meta name="author" content="Priyank Khatri" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://stockply.io/" />

    <!-- Theme & Favicon -->
    <meta name="theme-color" content="#FF6B00" />
    <meta name="msapplication-TileColor" content="#FF6B00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stockply" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stockply.io/" />
    <meta property="og:title" content="Stockply | Supply Chain Clarity, Beautifully Delivered" />
    <meta property="og:description" content="Experience the high-fidelity inventory management ecosystem. Real-time tracking and intelligent analytics for shops and suppliers." />
    <meta property="og:image" content="https://stockply.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Stockply" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stockply | Advanced Inventory Management" />
    <meta name="twitter:description" content="Optimize your supply chain with Stockply. Real-time tracking and seamless fulfillment for the modern retail ecosystem." />
    <meta name="twitter:image" content="https://stockply.io/og-image.png" />
    <meta name="twitter:site" content="@stockply" />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Stockply",
      "url": "https://stockply.io",
      "logo": "https://stockply.io/favicon.svg",
      "description": "Premium inventory management ecosystem for retail shops and suppliers. Features real-time tracking, intelligent analytics, and seamless logistics.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "author": {
        "@type": "Person",
        "name": "Priyank Khatri",
        "url": "https://github.com/Priyankkhatri"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Stockply",
      "url": "https://stockply.io",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://stockply.io/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />

    <!-- DNS Prefetch for API -->
    <link rel="dns-prefetch" href="https://stockply-backend.onrender.com" />
    
    <!-- Preload critical assets -->
    <link rel="modulepreload" href="/src/main.jsx" />
  </head>
  <body>
    <!-- Noscript fallback for SEO bots -->
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui;">
        <h1>Stockply — Supply Chain Management</h1>
        <p>Stockply connects shop owners and suppliers through premium inventory management. Real-time tracking, intelligent analytics, and seamless logistics.</p>
        <p>Please enable JavaScript to use Stockply.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
